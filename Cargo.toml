[package]
name = "sosilol"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["SegfaultSommeliers"]
repository = "https://github.com/SegfaultSommeliers/cf-sosilol"

[lib]
crate-type = ["cdylib"]

[dependencies]
worker = { version = "0.9", features = ["http", "axum", "d1"] }
axum = { version = "0.8.9", default-features = false, features = ["json", "query"] }
tower-service = "0.3.3"
maud = { version = "0.27.0", features = ["axum"] }
base64 = { version = "0.23.1", default-features = false, features = ["alloc"] }
sha2 = { version = "0.11.1", default-features = false }
reqwest = { version = "0.13.5", features = ["json", "form"], default-features = false }
thiserror = "2.0.21"
serde = { version = "1.0.229", features = ["derive"] }
axum-extra = { version = "0.12.6", features = ["cookie-private"] }
serde_json = "1.0.154"
getrandom = "0.4.3"
serde_urlencoded = "0.7.1"
tracing = "0.1.44"
tracing-web = "0.1.4"
tracing-subscriber = { version = "0.3.23", features = ["json"] }
tower-http = { version = "0.7.1", features = ["trace", "request-id"] }
time = { version = "0.3.55", features = ["local-offset"] }
rand = { version = "0.10.4", default-features = false, features = ["thread_rng"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
uuid = { version = "1", features = ["js"] }
getrandom = { version = "0.4.3", features = ["wasm_js"] }
getrandom02 = { package = "getrandom", version = "0.2", features = ["js"] }
time = { version = "0.3.55", features = ["wasm-bindgen"] }
