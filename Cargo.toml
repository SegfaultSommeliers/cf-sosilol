[package]
name = "cf-sosilol"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["SegfaultSommeliers"]
repository = "https://github.com/SegfaultSommeliers/cf-sosilol"

[lib]
crate-type = ["cdylib"]

[dependencies]
worker = { version = "0.9", features = ["http", "axum", "d1"] }
worker-macros = { version = "0.9", features = ['http'] }
axum = { version = "0.8", default-features = false, features = ["json"] }
tower-service = "0.3.3"
anyhow = "1.0.104"
maud = { version = "0.27.0", features = ["axum"] }
base64 = { version = "0.23.1", default-features = false, features = ["alloc"] }
sha2 = { version = "0.11.1", default-features = false }
reqwest = { version = "0.13.5", features = ["json", "form"], default-features = false }
thiserror = "2.0.21"
serde = { version = "1.0.229", features = ["derive"] }
axum-extra = { version = "0.12.6", features = ["cookie-private"] }
serde_json = "1.0.154"
getrandom = { version = "0.2", features = ["js"] }
serde_urlencoded = "0.7.1"
