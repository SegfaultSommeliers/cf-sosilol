version = 1

[[annotations]]
path = [
    "src/app.rs",
    "src/app/error.rs",
    "src/app/request_logger.rs",
    "src/app/router.rs",
    "src/app/state.rs",
    "src/auth.rs",
    "src/auth/github.rs",
    "src/auth/oauth.rs",
    "src/auth/pkce.rs",
    "src/auth/routes.rs",
    "src/auth/service.rs",
    "src/auth/session.rs",
    "src/auth/storage.rs",
    "src/layouts.rs",
    "src/lib.rs",
    "src/models.rs",
    "src/models/paste.rs",
    "src/pages.rs",
    "src/pages/authors.rs",
    "src/paste.rs",
    "src/paste/**/*.rs",
    "src/rate_limit.rs",
    "src/rate_limit/**/*.rs",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 SegfaultSommeliers"
SPDX-License-Identifier = "MIT OR Apache-2.0"

[[annotations]]
path = [
    "frontend/css/main.css",
    "frontend/js/main.js",
    "src/layouts/bare.rs",
    "src/layouts/base.rs",
    "src/pages/main.rs",
    "src/pages/paste.rs",
    "src/pages/profile.rs",
]
precedence = "aggregate"
SPDX-FileCopyrightText = [
    "2026 Konstantin Konovalov",
    "2026 SegfaultSommeliers",
]
SPDX-License-Identifier = "MIT"

[[annotations]]
path = [
    ".dev.vars.example",
    ".github/workflows/ci.yml",
    ".github/workflows/deploy.yml",
    ".gitignore",
    "README.md",
    "biome.json",
    "Cargo.toml",
    "package.json",
    "rustfmt.toml",
    "wrangler.toml",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 SegfaultSommeliers"
SPDX-License-Identifier = "MIT OR Apache-2.0"

[[annotations]]
path = [
    "Cargo.lock",
    "bun.lock",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "NONE"
SPDX-License-Identifier = "CC0-1.0"

[[annotations]]
path = [
    "migrations/**/*.sql",
]
precedence = "aggregate"
