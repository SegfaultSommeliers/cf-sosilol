name = "cf-sosilol"
main = "build/index.js"
compatibility_date = "2026-11-15"

workers_dev = false
preview_urls = false

[observability]
enabled = true

[assets]
directory = "./dist"
run_worker_first = ["/*", "!/assets/*"]

[build]
command = "cargo install -q \"worker-build@^0.9\" && worker-build --release --panic-unwind"

[vars]
MAX_PASTE_SIZE_BYTES = "65536"

[[ratelimits]]
name = "GLOBAL_RATE_LIMITER"
namespace_id = "1"

[ratelimits.simple]
limit = 60
period = 60

[[ratelimits]]
name = "SAVE_RATE_LIMITER"
namespace_id = "2"

[ratelimits.simple]
limit = 10
period = 60

[[ratelimits]]
name = "AUTH_REQUEST_RATE_LIMITER"
namespace_id = "3"

[ratelimits.simple]
limit = 5
period = 60

[[d1_databases]]
binding = "DB"
database_name = "pastes"
database_id = "31422626-b9f6-45aa-b6a3-727698834786"
migrations_dir = "migrations"

[[r2_buckets]]
bucket_name = "pastes"
binding = "BUCKET"
